<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Selected Work | Duong Tran</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1f2c27;--ink-soft:#425149;--muted:#718078;--paper:#f7f5ef;--paper-deep:#eeece3;--card:#fffdf8;--sage-soft:#dce6d9;--forest:#294338;--forest-deep:#1d3229;--line:#d9ded6;--radius-md:16px;--max:1180px}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink)}
a{color:var(--forest)}
.top{max-width:var(--max);margin:0 auto;padding:20px 24px}.top a{text-decoration:none;font-weight:600}
.hero{max-width:var(--max);margin:0 auto;padding:12px 24px 28px}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,6vw,64px);margin:0 0 8px;color:var(--forest-deep)}
.hero p{margin:0;color:var(--ink-soft);max-width:620px;line-height:1.6}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px 48px;display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
nav{position:sticky;top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;gap:4px}
nav button,nav a{font:inherit;font-weight:600;text-align:left;border:0;background:none;color:var(--ink-soft);padding:12px 14px;border-radius:12px;cursor:pointer;text-decoration:none}
nav button:hover,nav a:hover{background:var(--paper-deep)}
nav button[aria-selected=true]{background:var(--forest);color:#fff}
nav a::after{content:" \2197";color:var(--muted)}
main iframe{display:none;width:100%;border:0;border-radius:var(--radius-md);background:var(--card);min-height:600px}
main iframe.on{display:block}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{top:0;z-index:5;flex-direction:row;overflow-x:auto;border-radius:0 0 var(--radius-md) var(--radius-md)}nav button,nav a{white-space:nowrap}}
</style></head><body>
<div class="top"><a href="https://htmlpreview.github.io/?https://github.com/duongduongblue/duong-tran-portfolio/blob/review/index.html">&larr; Back to portfolio</a></div>
<header class="hero"><h1>Selected Work</h1><p>Duong Tran's work across HR, Operations, PR and Events, in one place. Pick a section on the left.</p></header>
<div class="wrap">
<nav role="tablist" aria-label="Work sections">
<button role="tab" data-t="hr" aria-selected="true">HR</button>
<button role="tab" data-t="ops" aria-selected="false">Operations</button>
<button role="tab" data-t="pr" aria-selected="false">PR</button>
<button role="tab" data-t="events" aria-selected="false">Events</button>
<a href="https://htmlpreview.github.io/?https://github.com/duongduongblue/duong-tran-portfolio/blob/review/work/recruitment-dashboard.html" target="_blank" rel="noopener">Recruitment</a>
</nav>
<main>
<iframe id="hr" class="on" src="https://htmlpreview.github.io/?https://github.com/duongduongblue/duong-tran-portfolio/blob/review/work/hr.html" title="HR"></iframe>
<iframe id="ops" src="https://htmlpreview.github.io/?https://github.com/duongduongblue/duong-tran-portfolio/blob/review/work/ops.html" title="Operations" loading="lazy"></iframe>
<iframe id="pr" src="https://htmlpreview.github.io/?https://github.com/duongduongblue/duong-tran-portfolio/blob/review/work/pr.html" title="PR" loading="lazy"></iframe>
<iframe id="events" src="https://htmlpreview.github.io/?https://github.com/duongduongblue/duong-tran-portfolio/blob/review/work/events.html" title="Events" loading="lazy"></iframe>
</main></div>
<script>
const fit=f=>{try{const d=f.contentDocument;if(d&&d.body)f.style.height=d.documentElement.scrollHeight+"px"}catch(e){}};
document.querySelectorAll("main iframe").forEach(f=>{f.addEventListener("load",()=>{fit(f);try{new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body)}catch(e){}})});
const show=t=>{document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
document.querySelectorAll("main iframe").forEach(f=>{f.classList.toggle("on",f.id===t);if(f.id===t){f.loading="eager";fit(f)}});history.replaceState(null,"","#"+t)};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{show(b.dataset.t);if(innerWidth>820)scrollTo({top:document.querySelector(".wrap").offsetTop-10,behavior:"smooth"})});
const h=location.hash.slice(1);if(["hr","ops","pr","events"].includes(h))show(h);
</script></body></html>
